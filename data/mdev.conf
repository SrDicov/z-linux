# Minimal mdev.conf for the dinit live image (mdevd uses the same syntax as mdev).
# Unlike udev, mdevd does not autoload drivers: hotplug modprobe per MODALIAS.
$MODALIAS=.* root:root 660 @/usr/bin/modprobe "$MODALIAS"

null root:root 666
zero root:root 666
full root:root 666
random root:root 666
urandom root:root 666
ptmx root:root 666
tty root:root 600
console root:root 600
tty[0-9]* root:tty 660
vcsa*[0-9]* root:tty 660
fuse root:root 666
kvm root:kvm 660
loop[0-9]+ root:disk 660
sr[0-9]+ root:cdrom 660
sd[a-z]+ root:disk 660
sd[a-z]+[0-9]+ root:disk 660
mmcblk[0-9]+ root:disk 660
mmcblk[0-9]+p[0-9]+ root:disk 660
nvme[0-9]+ root:disk 660
nvme[0-9]+n[0-9]+ root:disk 660
nvme[0-9]+n[0-9]+p[0-9]+ root:disk 660
input/event[0-9]+ root:input 660
input/mice root:input 660
input/mouse[0-9]+ root:input 660
fb[0-9]+ root:video 660
dri/card[0-9]+ root:video 660
dri/renderD[0-9]+ root:video 660
snd/.* root:audio 660
