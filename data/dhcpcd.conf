# dhcpcd configuration for the Z Linux live image.
# Based on the Void Linux default, with live-specific tweaks:
#  - noarp: skip ARP conflict probing/announcing (~5s faster lease).
controlgroup wheel
duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option static_routes, classless_static_routes
option interface_mtu
option host_name
require dhcp_server_identifier
slaac private
noarp
